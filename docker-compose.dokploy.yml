# WP Launcher on Dokploy.
#
# Differs from docker-compose.yml in four ways, all forced by the platform:
#   1. No Traefik service — Dokploy's Traefik owns :80/:443 and routes us by label.
#   2. Services join the external `dokploy-network`, the only network that
#      Traefik watches, and pin `traefik.docker.network` so multi-network
#      containers resolve correctly.
#   3. Nothing stateful lives in the repo checkout: Dokploy deletes `code/` on
#      every redeploy. State is a named volume, or under `../files/`.
#   4. No published host ports. The dashboard's nginx proxies /api/ to the API
#      internally, so the API never needs to face the host.
#
# See guides/dokploy-deployment.md for setup, including the absolute paths that
# PRODUCT_ASSETS_PATH and SITES_HOST_PATH must be given.

services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      EXEC: 1
      POST: 1
      BUILD: 1
      INFO: 1
      SYSTEM: 1
    networks:
      - provisioner-internal

  traefik-docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Read-only. Traefik only needs to see containers and their labels.
      CONTAINERS: 1
      NETWORKS: 1
      INFO: 1
      POST: 0
      EXEC: 0
      BUILD: 0
      IMAGES: 0
      VOLUMES: 0
    networks:
      - traefik-internal

  wpl-traefik:
    image: traefik:v3.6
    restart: unless-stopped
    entrypoint:
      # Traefik's static config is a fixed flag list, but the ACME challenge
      # type depends on whether a DNS provider was configured. Append those
      # flags here rather than shipping two compose files.
      #
      # Every `$` below is written `$$`: compose interpolates a single `$` and
      # would replace these shell variables with empty strings.
      - /bin/sh
      - -c
      - |
        if [ -n "$${ACME_DNS_PROVIDER:-}" ]; then
          exec traefik "$$@" \
            --certificatesresolvers.wpl.acme.dnschallenge.provider="$$ACME_DNS_PROVIDER" \
            "--entrypoints.websecure.http.tls.domains[0].main=$$BASE_DOMAIN" \
            "--entrypoints.websecure.http.tls.domains[0].sans=*.$$BASE_DOMAIN"
        fi
        exec traefik "$$@" --certificatesresolvers.wpl.acme.httpchallenge.entrypoint=web
      - "--"
    command:
      - "--entrypoints.web.address=:80"
      # We terminate TLS now. Dokploy's Traefik forwards the raw stream to us,
      # so there is no upstream header to trust and no trustedips to get wrong.
      - "--entrypoints.websecure.address=:443"
      # Issuance is driven from the entrypoint, not per-router labels, so site
      # containers need no certresolver label and the certificate mode can be
      # changed without relaunching anything.
      - "--entrypoints.websecure.http.tls.certresolver=wpl"
      - "--certificatesresolvers.wpl.acme.email=${ACME_EMAIL:?Set ACME_EMAIL}"
      - "--certificatesresolvers.wpl.acme.storage=/acme/acme.json"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=tcp://traefik-docker-proxy:2375"
      # Select by our own label rather than `traefik.enable`, which every
      # container on this host sets for Dokploy's Traefik. Without the
      # constraint we would build routers for Supabase, the Dokploy dashboard
      # and even our own catch-all, all of which reference a `websecure`
      # entrypoint that does not exist here.
      - "--providers.docker.exposedbydefault=true"
      - "--providers.docker.constraints=Label(`wp-launcher.routable`,`true`)"
      - "--providers.docker.network=wpl-sites"
      - "--api.dashboard=false"
      # DEBUG prints the fully-resolved static config, which is the only way to
      # confirm which ACME challenge the entrypoint selected.
      - "--log.level=${TRAEFIK_LOG_LEVEL:-INFO}"
    environment:
      # Read by the entrypoint above. Empty means per-site HTTP-01.
      - ACME_DNS_PROVIDER=${ACME_DNS_PROVIDER:-}
      - BASE_DOMAIN=${BASE_DOMAIN:?Set BASE_DOMAIN}
      # Credentials for ACME_DNS_PROVIDER, named exactly as Traefik's docs
      # require. Unset ones are harmless; add others as needed.
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-}
      - DO_AUTH_TOKEN=${DO_AUTH_TOKEN:-}
    volumes:
      - wpl-acme:/acme
    labels:
      # Read by DOKPLOY's Traefik, not ours. One catch-all router for every
      # site subdomain, forwarded as plain HTTP. No certresolver: the wildcard
      # is already loaded upstream, and a resolver here would fire per-site
      # ACME requests against Let's Encrypt's 50-per-week limit.
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.wpl-sites.rule=HostRegexp(`${BASE_DOMAIN_REGEX:?Set BASE_DOMAIN_REGEX}`)"
      # Lower than any default-priority router, so the per-site routers that
      # already-running sites carry keep winning. This is what makes the
      # rollout safe for existing sites.
      - "traefik.http.routers.wpl-sites.priority=1"
      - "traefik.http.routers.wpl-sites.entrypoints=websecure"
      - "traefik.http.routers.wpl-sites.tls=true"
      # The wildcard. tls.domains must be explicit: the rule above is a
      # HostRegexp, and Traefik cannot expand a regex into names to request a
      # certificate for — without this it silently serves its self-signed
      # default. Requires a DNS-01 resolver, since Let's Encrypt will not
      # issue wildcards over HTTP-01. See guides/dokploy-deployment.md §6.
      - "traefik.http.routers.wpl-sites.tls.certresolver=${WILDCARD_CERT_RESOLVER:-cloudflare}"
      - "traefik.http.routers.wpl-sites.tls.domains[0].main=${BASE_DOMAIN}"
      - "traefik.http.routers.wpl-sites.tls.domains[0].sans=*.${BASE_DOMAIN}"
      - "traefik.http.services.wpl-sites.loadbalancer.server.port=80"
    networks:
      - dokploy-network
      - wpl-sites
      - traefik-internal
    depends_on:
      - traefik-docker-proxy

  provisioner:
    build: ./packages/provisioner
    restart: unless-stopped
    environment:
      - DOCKER_HOST=tcp://docker-proxy:2375
      - DOCKER_API_VERSION=1.44
      - PORT=4000
      - INTERNAL_KEY=${PROVISIONER_INTERNAL_KEY:?Set PROVISIONER_INTERNAL_KEY}
      - BASE_DOMAIN=${BASE_DOMAIN:?Set BASE_DOMAIN}
      # Sites land on the private network, routed by wpl-traefik.
      - DOCKER_NETWORK=wpl-sites
      - TRAEFIK_NETWORK=wpl-sites
      # Hide site containers from Dokploy's Traefik. It shares this Docker
      # daemon, and a `traefik.enable=true` label makes it build a per-host
      # router that outranks our catch-all and then times out, because it is
      # not attached to wpl-sites.
      - SITE_TRAEFIK_ENABLE=false
      - CONTAINER_MEMORY=${CONTAINER_MEMORY:-268435456}
      - CONTAINER_CPU=${CONTAINER_CPU:-0.5}
      - WP_UPLOAD_LIMIT=${WP_UPLOAD_LIMIT:-2097152}
      - WP_DISK_QUOTA=${WP_DISK_QUOTA:-104857600}
      # The inner tier is plain HTTP; TLS terminates once, at Dokploy's
      # Traefik. Not an operator knob any more, so it is not read from env.
      - ENABLE_TLS=false
      - PRODUCT_ASSETS_PATH=${PRODUCT_ASSETS_PATH:?Set PRODUCT_ASSETS_PATH to an absolute host path}
      - SITES_HOST_PATH=${SITES_HOST_PATH:?Set SITES_HOST_PATH to an absolute host path}
      # Custom-domain routers are written here for Traefik's file provider.
      - CUSTOM_DOMAINS_DIR=/etc/traefik/dynamic/custom-domains
    volumes:
      - ${PRODUCT_ASSETS_PATH}:/product-assets
      - wpl-data:/app/data
      - /etc/dokploy/traefik/dynamic:/etc/traefik/dynamic
      - /proc:/host/proc:ro
    networks:
      # Both `internal`, so the provisioner has no outbound internet. That is
      # correct: it requests image pulls through the Docker API and the
      # *daemon* performs them.
      - provisioner-internal
      - wpl-control
    depends_on:
      - docker-proxy

  api:
    build: ./packages/api
    restart: unless-stopped
    volumes:
      - wpl-data:/app/data
      - ./blueprints:/app/blueprints
      - ./products:/app/products
      - ./templates:/app/templates
      - ${PRODUCT_ASSETS_PATH}:/app/product-assets
      - ./wordpress:/app/wordpress:ro
      - ./version.json:/app/version.json:ro
      - ${SITES_HOST_PATH}:/app/sites
    environment:
      - SITES_HOST_PATH=${SITES_HOST_PATH:?Set SITES_HOST_PATH to an absolute host path}
      - SITES_DIR=/app/sites
      - NODE_ENV=production
      - PORT=3737
      - API_KEY=${API_KEY:?Set API_KEY}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - PUBLIC_URL=${PUBLIC_URL:?Set PUBLIC_URL, e.g. https://demo.example.com}
      - PROVISIONER_URL=http://provisioner:4000
      - PROVISIONER_INTERNAL_KEY=${PROVISIONER_INTERNAL_KEY:?Set PROVISIONER_INTERNAL_KEY}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-smtp}
      # No mailpit here: real SMTP is required for verification and invites.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-WP Launcher <noreply@localhost>}
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - BASE_DOMAIN=${BASE_DOMAIN:?Set BASE_DOMAIN}
      - WP_IMAGE=${WP_IMAGE:-wp-launcher/wordpress:latest}
      - MAX_SITES_PER_USER=${MAX_SITES_PER_USER:-3}
      - CARD_LAYOUT=${CARD_LAYOUT:-full}
      - DATA_DIR=/app/data
      - BLUEPRINT_CONFIGS_DIR=/app/blueprints
      - PRODUCT_CONFIGS_DIR=/app/products
      - TEMPLATE_CONFIGS_DIR=/app/templates
    networks:
      # Reaches the provisioner, and is reached by the dashboard's nginx.
      - wpl-control
      # Needed to probe site containers for readiness, and for egress
      # (SMTP, wordpress.org).
      - wpl-sites
    depends_on:
      - provisioner

  dashboard:
    build: ./packages/dashboard
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.wpl-dashboard.rule=Host(`${BASE_DOMAIN}`)"
      - "traefik.http.routers.wpl-dashboard.entrypoints=websecure"
      - "traefik.http.routers.wpl-dashboard.tls=true"
      - "traefik.http.routers.wpl-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.services.wpl-dashboard.loadbalancer.server.port=80"
    networks:
      # Routed by Dokploy's Traefik at the apex domain.
      - dokploy-network
      # Its nginx proxies /api/ to api:3737.
      - wpl-control
    depends_on:
      - api

  adminer:
    image: adminer:latest
    restart: unless-stopped
    volumes:
      - ./adminer/adminer.css:/var/www/html/adminer.css:ro
    environment:
      - ADMINER_DEFAULT_SERVER=localhost
    labels:
      # Read by OUR Traefik, which selects on this label. db.BASE_DOMAIN
      # already matches the catch-all router at the Dokploy tier, so nothing
      # is configured there. Deliberately NO `traefik.enable`: that would make
      # Dokploy's Traefik claim this host and fail to reach it.
      - "wp-launcher.routable=true"
      - "traefik.docker.network=wpl-sites"
      - "traefik.http.routers.wpl-adminer.rule=Host(`db.${BASE_DOMAIN}`)"
      - "traefik.http.routers.wpl-adminer.entrypoints=web"
      - "traefik.http.routers.wpl-adminer.middlewares=wpl-adminer-auth"
      # Adminer connects to any host you type into its form. Unauthenticated,
      # that makes it an open console against everything on this network.
      - "traefik.http.middlewares.wpl-adminer-auth.basicauth.users=${ADMINER_AUTH_USERS:?Set ADMINER_AUTH_USERS}"
      - "traefik.http.services.wpl-adminer.loadbalancer.server.port=8080"
    networks:
      # Where the site databases it exists to talk to now live.
      - wpl-sites

networks:
  # Provided by Dokploy. Declared external so compose attaches rather than
  # creating its own — Traefik only watches this one.
  dokploy-network:
    external: true

  # Site containers and the things that must talk to them. NOT `internal`:
  # sites need outbound internet to install plugins from wordpress.org.
  #
  # `name:` is mandatory. Without it compose creates `<project>_wpl-sites`,
  # and the provisioner's DOCKER_NETWORK would name a network that does not
  # exist.
  wpl-sites:
    driver: bridge
    name: wpl-sites

  # Control plane. The API reaches the provisioner here; sites cannot.
  wpl-control:
    driver: bridge
    internal: true
    name: wpl-control

  provisioner-internal:
    driver: bridge
    internal: true

  # Isolates Traefik's read-only view of the Docker API from the
  # provisioner's read-write one.
  traefik-internal:
    driver: bridge
    internal: true

volumes:
  # Named rather than a bind mount so Dokploy's volume backup covers the
  # database. `code/` is wiped on redeploy, so this must not live there.
  wpl-data:

  # Certificates. A named volume rather than a path in the checkout: Dokploy
  # deletes code/ on every redeploy, which would discard every certificate and
  # exhaust Let's Encrypt's rate limit within days.
  wpl-acme:
